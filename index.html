<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<meta name="description" content="Memory Palace: walk through a palace of your own memories in VR on Meta Quest.">
<title>Memory Palace</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<script>
  // Arriving from another VR page (the portal from Endless Clay): the headset can hand over its VR session the moment
  // this page starts loading. Listen before the big scripts load, or the offer is missed and the headset waits on a
  // black screen. The session is asked for right here, inside the offer; the app picks it up once it has loaded.
  window.__xrGranted = false; window.__xrSession = null;
  if (navigator.xr && navigator.xr.addEventListener) navigator.xr.addEventListener('sessiongranted', function () {
    window.__xrGranted = true;
    window.__xrSession = navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
    window.__xrSession.catch(function () { window.__xrSession = null; });
    window.dispatchEvent(new Event('xrgranted'));
  });
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="scene" aria-label="The memory palace, seen from its forecourt"></canvas>
<section id="card" aria-live="polite">
  <p class="eyebrow">Your mind, built in stone</p>
  <h1>Memory Palace</h1>
  <p id="status">Raising the palace…</p>
  <div class="row">
    <button id="enter" type="button">Enter the palace</button>
    <button id="home" type="button">Endless Clay</button>
    <button id="planBtn" type="button">Open palace plan</button>
  </div>
  <p class="hint">Walk through the bronze ring in the forecourt to reach Endless Clay. Your plan and everything in your palace stay on this headset.</p>
  <input id="planFile" type="file" accept=".json,application/json" hidden>
</section>

<script>

  if ('serviceWorker' in navigator && !/[?&]nosw\b/.test(location.search)) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
</script>
